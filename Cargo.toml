[package]
name = "ocus"
version = "0.1.0"
edition = "2024"
authors = ["sammwy"]
repository = "https://github.com/sammwyy/ocus"

[dependencies]
creamui = { git = "https://github.com/sammwyy/creamui.git", rev = "335824c350b4eb4d986efd25546d0f21e337f83e", version = "0.3.0", features = ["gpu", "image", "system-theme", "theme-watch"] }
directories = "=5.0.1"
ebur128 = "0.1.11"
ffmpeg-next = { version = "=7.1.0", default-features = false, features = ["format", "codec", "filter", "software-scaling", "software-resampling"] }
rfd = "=0.17.2"
rodio = { version = "=0.22.2", default-features = false, features = ["playback"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
swash = "=0.2.10"
tempfile = "=3.27.0"
toml = "=0.9.12"
wgpu = { version = "22", default-features = false, features = ["wgsl", "dx12", "metal"] }

[build-dependencies]
winres = "0.1.12"
