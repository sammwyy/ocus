[package]
name = "ocus"
version = "0.1.0"
edition = "2024"

[dependencies]
creamui = { git = "https://github.com/sammwyy/creamui.git", rev = "a20e43ebe5940c01151c76d3b89cb1e36b3e9379", version = "0.3.0" }
ffmpeg-next = { version = "=7.1.0", default-features = false, features = ["format", "codec", "software-scaling"] }
rfd = "=0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = { version = "22", default-features = false, features = ["wgsl", "dx12", "metal"] }
